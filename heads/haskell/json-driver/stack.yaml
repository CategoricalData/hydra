# Standalone #376 cold-only published-host Haskell DSL->dist seeder (Stack project).
#
# Haskell analog of heads/java/json-driver/. Compiles a haskell-target-only
# seeder (app/ColdSeedMain.hs) + the head's coder-agnostic generation modules +
# the kernel/haskell DSL authoring sources against the PUBLISHED Hydra packages
# from Hackage (extra-deps below, pinned at 0.17.3) — NOT against any local
# dist/haskell tree. Running the seeder emits dist/haskell/* from dist/json on a
# cold clone, before the main host compiles. This is what lets dist/haskell be
# untracked (#376).
#
# Deliberately a SEPARATE stack project (not part of heads/haskell) so the
# hydra-* extra-deps resolve to the published Hackage artifacts rather than the
# co-generated dist trees.
#
# The unpublished packages (hydra-{go,coq,wasm,ext,bench}, #589) are NOT listed
# here — the cold seeder does not link their coders. Their dist/haskell SOURCE is
# still seeded from dist/json via the Haskell coder.
resolver: lts-24.7

system-ghc: true
install-ghc: false

packages:
  - .

# Published Hydra packages consumed from Hackage, pinned at 0.17.3 — the first
# fully consistent republish of the whole set since 0.17.1 (0.17.2's hydra-build
# was a stale 3/8-module truncation; #621's artifact-content gate now guards
# against a repeat). Bumped from 0.17.1 straight to 0.17.3, skipping 0.17.2
# entirely, since 0.17.2 was never a valid target for this pin set. Verified via
# Hackage .cabal content (not just HTTP 200) that hydra-build-0.17.3 exposes all
# 8 modules before bumping.
#
# #630 shim: hydra-{haskell,python,scala,typescript,lisp} are deliberately
# ABSENT here — package.yaml source-dirs them from dist/haskell/<pkg> instead,
# since the published 0.17.3 releases predate the overlaySubs coder-signature
# change. See the #630 comment in package.yaml. Retire this omission (restore
# the 5 entries below) once a hostVersion publish ships the new signatures.
extra-deps:
  - hydra-kernel-0.17.3
  - hydra-java-0.17.3
  - hydra-jvm-0.17.3
  - hydra-rdf-0.17.3
  - hydra-pg-0.17.3
  - hydra-build-0.17.3
