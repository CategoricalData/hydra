# Standalone #376 cold-only published-host Haskell DSL->dist seeder (Stack project).
#
# Haskell analog of heads/java/json-driver/. Compiles a haskell-target-only
# seeder (app/ColdSeedMain.hs) + the head's coder-agnostic generation modules +
# the kernel/haskell DSL authoring sources against the PUBLISHED Hydra packages
# from Hackage (extra-deps below, pinned at 0.17.4) — NOT against any local
# dist/haskell tree. Running the seeder emits dist/haskell/* from dist/json on a
# cold clone, before the main host compiles. This is what lets dist/haskell be
# untracked (#376).
#
# Deliberately a SEPARATE stack project (not part of heads/haskell) so the
# hydra-* extra-deps resolve to the published Hackage artifacts rather than the
# co-generated dist trees.
#
# The unpublished packages (hydra-{go,coq,wasm,ext,bench}, #589) are NOT listed
# here — the cold seeder does not link their coders. Their dist/haskell SOURCE is
# still seeded from dist/json via the Haskell coder.
resolver: lts-24.7

system-ghc: true
install-ghc: false

packages:
  - .

# Published Hydra packages consumed from Hackage, pinned at 0.17.5. Bumped from
# 0.17.4 as part of the 0.17.5 post-publish host-version consumption (hostVersion
# 0.17.4→0.17.5 + shim retirement). Verified via Hackage .cabal content (not just
# HTTP 200) that all 11 pinned packages exist at 0.17.5 with their modules exposed
# before bumping — the same check that caught 0.17.2's 3/8-module hydra-build
# truncation, which is why 0.17.2 was skipped entirely. hydra-build-0.17.5 confirmed
# to expose Hydra.Build.{Format,Routing,Walk} (Walk is what #416 D-bis consumes).
extra-deps:
  - hydra-kernel-0.17.5
  - hydra-haskell-0.17.5
  - hydra-java-0.17.5
  - hydra-jvm-0.17.5
  - hydra-python-0.17.5
  - hydra-scala-0.17.5
  - hydra-typescript-0.17.5
  - hydra-lisp-0.17.5
  - hydra-rdf-0.17.5
  - hydra-pg-0.17.5
  - hydra-build-0.17.5
