name: Deploy API docs to GitHub Pages

# Tag-triggered: build one JavaDoc tree per published Java package, one
# Sphinx tree per published Python package, and one Scaladoc tree per
# published Scala package, from the dist/java/, dist/python/, and dist/scala/
# trees the CI workflow already generated on a tag push, and deploy them
# together as a single Pages artifact at java/javadoc/<package>/,
# python/sphinx/<package>/, and scala/scaladoc/<package>/ respectively.
# Commits nothing to any branch.
# workflow_dispatch covers manual re-runs without re-tagging.
#
# Why workflow_run instead of inlining into ci.yml: keeps Pages-specific
# logic (permissions: pages/id-token, concurrency: pages, environment:
# github-pages) isolated from the test matrix. The trade-off is a
# cross-workflow artifact download, handled below via run-id + github-token.
#
# Java: per-package layout + -linkoffline cross-links: #616. Originally #450.
# Companion: #449 (the strict @link errors absorbed here via -Xdoclint:none).
# Companion: #451 (restore hydra-ext to the build once it ships to Maven
# Central).
#
# Python: per-package Sphinx layout, mirroring #616: #620. Sphinx (not pdoc)
# was chosen because the Python coder's docstrings already contain Sphinx/RST
# cross-reference roles (:class:/:func:) — see hydra.python.serde in
# packages/hydra-python. Cross-package intersphinx links are a follow-up, same
# as Java's -linkoffline wiring.
#
# Scala: per-package Scaladoc layout: #619, mirroring #616's approach with sbt
# in place of gradle. Documented set is the Scala "core three" (hydra-kernel,
# hydra-rdf, hydra-pg) rather than the full sbt PUBLISH_SET
# (heads/scala/bin/publish-sbt.sh) — the rest of that set are coders for
# OTHER hosts (Haskell/Java/Python/Lisp/TypeScript/Scala-itself), not content
# a Scala-API reader is browsing for.
#
# All three doc systems (JavaDoc, Sphinx, Scaladoc) are built in the same job
# so they land in one shared _site/ tree behind one
# upload-pages-artifact/deploy step (Pages deploys exactly one artifact per
# run).

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read  # required for cross-workflow artifact download

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build per-package JavaDoc + Sphinx + Scaladoc site
    runs-on: ubuntu-latest
    # Coarse gate: cheap rejections happen here so the job doesn't even start
    # for non-tag CI runs. The fine-grained tag check (which needs the GitHub
    # API to disambiguate workflow_run's `head_branch` field) runs in the
    # "Resolve CI run" step and exits the job early if the run wasn't for a
    # tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Pinned to 11.0.19 to match ci.yml: newer 11.x patches (verified
          # 11.0.31) regressed generic varargs inference on the deeply-nested
          # PersistentMap.ofEntries call in hydra/json/Bootstrap.java, which the
          # javadoc/publish build here also compiles.
          java-version: '11.0.19'

      # Cross-workflow artifact download: pull dist-java from the CI run that
      # triggered us. For workflow_dispatch, fall back to the latest successful
      # CI run on main.
      #
      # Also: confirm the triggering run was a tag push (not a branch push),
      # by querying the GitHub API for the run's head_branch and matching it
      # against the repo's tags. This is the fine-grained tag gate.
      - name: Resolve CI run and confirm tag
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_id=$(gh run list --workflow=CI --status=success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
          else
            run_id="${{ github.event.workflow_run.id }}"
          fi
          echo "Resolved CI run ID: $run_id"

          head_branch=$(gh api "/repos/${GH_REPO}/actions/runs/${run_id}" \
            --jq '.head_branch // ""')
          echo "head_branch reported by API: '${head_branch}'"

          # Confirm it names an existing tag. (workflow_dispatch can bypass
          # this; we trust the operator if they invoked Pages manually.)
          proceed=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if [ -z "$head_branch" ] || \
               ! gh api "/repos/${GH_REPO}/git/refs/tags/${head_branch}" \
                    >/dev/null 2>&1; then
              echo "::notice::triggering run was not a tag push; skipping."
              proceed=false
            else
              echo "Confirmed '${head_branch}' is a tag."
            fi
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

      - name: Download dist-java from CI run
        if: steps.ci-run.outputs.proceed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist-java
          path: dist/java/
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download dist-python from CI run
        if: steps.ci-run.outputs.proceed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist-python
          path: dist/python/
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      # Gradle drives each package's javadoc via that package's OWN standalone
      # build.gradle (#616). This is the key correctness point: a bare `javadoc`
      # over loose dist/java/ sources has no classpath, so hydra-pg's overlay
      # bridges (hydra.overlay.java.{tinkerpop,cypher,gql,tools}) fail to
      # resolve their third-party dependencies (TinkerPop/Gremlin, ANTLR,
      # commons-text) and the ANTLR-generated parser classes they import don't
      # exist yet. Running the package's gradle `javadoc` task instead resolves
      # those dependencies from Maven Central and runs `generateGrammarSource`
      # first (javadoc.dependsOn generateGrammarSource), so ALL content —
      # including the Java-specific overlay integrations — is documented.
      # The dist/java/<pkg> projects are standalone (no gradle wrapper), so pin
      # a gradle version to put a `gradle` executable on PATH. 8.x is compatible
      # with the JDK 11 set up above (validated locally with 8.12.1 + 11.0.19).
      - name: Set up Gradle
        if: steps.ci-run.outputs.proceed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      # -Xdoclint:none downgrades doc-checking errors to warnings, absorbing the
      # cosmetic issues covered by #449 (unqualified @link refs to nested
      # case-classes, @param-name mismatches, and the `\_ -> body` / `Map<Name,
      # Term>` comments javadoc reads as malformed HTML). Injected via an init
      # script onto every Javadoc task so it also applies to the javadoc jar
      # built during publishToMavenLocal. This lenience is Pages-only; each
      # package's own Maven build keeps the strict default.
      #
      # hydra-ext is excluded until it ships to Maven Central (#451).
      - name: Build per-package javadoc via each package's gradle build
        if: steps.ci-run.outputs.proceed == 'true'
        env:
          PAGES_BASE_URL: https://categoricaldata.net/hydra/java/javadoc
        run: |
          set -euo pipefail
          root=_site/java/javadoc
          mkdir -p "$root"
          # Absolutize: build_pkg runs gradle from inside dist/java/<pkg>/, so the
          # -linkoffline element-list dir ("$root/<dep>") must be an absolute path
          # or javadoc resolves it relative to that subdir and can't find element-list.
          root=$(cd "$root" && pwd)

          init=$(mktemp --suffix=.gradle)
          printf '%s\n' \
            'allprojects {' \
            '    tasks.withType(Javadoc).configureEach {' \
            "        options.addStringOption('Xdoclint:none', '-quiet')" \
            '    }' \
            '}' > "$init"

          # The documented packages consume their inter-package dependencies as
          # published Maven coordinates (net.fortytwo.hydra.java:<pkg>:<version>).
          # Since this version isn't on Maven Central at build time, publish
          # every internal dependency to the local Maven repo first so the
          # downstream projects resolve them. Only three packages are consumed
          # as dependencies by others: hydra-kernel (by all), hydra-rdf (by
          # hydra-pg), and hydra-jvm (by hydra-java and hydra-scala). Publishing
          # just these three to mavenLocal lets every documented package below
          # resolve its inter-package deps. Publish order respects the graph:
          # kernel first (no Hydra deps), then rdf and jvm (which depend only on
          # kernel).
          for pkg in hydra-kernel hydra-rdf hydra-jvm; do
            echo "::group::publishToMavenLocal ${pkg}"
            ( cd "dist/java/${pkg}" && gradle -q --console=plain \
                --init-script "$init" publishToMavenLocal )
            echo "::endgroup::"
          done

          # Build each package's javadoc through its own gradle build, then
          # collect the output into java/javadoc/<pkg>/. Cross-package @link/@see
          # references (e.g. hydra-pg -> hydra.core.Type) are wired as real
          # hyperlinks via -linkoffline: the emitted href points at the
          # dependency's published Pages URL, while the element-list is read from
          # the dependency's just-built local output tree. This requires building
          # in dependency order so a dependency's tree exists before its
          # dependents build (kernel first; then rdf/jvm; then the rest).
          #
          # Inter-package dependency graph among the 12 documented packages
          # (from each dist/java/<pkg>/build.gradle):
          #   hydra-kernel: (none)
          #   hydra-rdf, hydra-jvm: hydra-kernel
          #   hydra-pg: hydra-kernel hydra-rdf
          #   hydra-java, hydra-scala: hydra-kernel hydra-jvm
          #   everything else (build/go/haskell/lisp/python/typescript): hydra-kernel
          declare -A DEPS=(
            [hydra-kernel]=""
            [hydra-rdf]="hydra-kernel"
            [hydra-jvm]="hydra-kernel"
            [hydra-pg]="hydra-kernel hydra-rdf"
            [hydra-java]="hydra-kernel hydra-jvm"
            [hydra-scala]="hydra-kernel hydra-jvm"
            [hydra-build]="hydra-kernel"
            [hydra-go]="hydra-kernel"
            [hydra-haskell]="hydra-kernel"
            [hydra-lisp]="hydra-kernel"
            [hydra-python]="hydra-kernel"
            [hydra-typescript]="hydra-kernel"
          )

          build_pkg() {
            local pkg="$1"
            # One -linkoffline per Hydra dependency: published URL + local
            # element-list dir (the dependency's already-built output tree).
            local link_init
            link_init=$(mktemp --suffix=.gradle)
            {
              echo 'allprojects {'
              echo '    tasks.withType(Javadoc).configureEach {'
              echo "        options.addStringOption('Xdoclint:none', '-quiet')"
              local dep
              for dep in ${DEPS[$pkg]}; do
                echo "        options.linksOffline('${PAGES_BASE_URL}/${dep}', '${root}/${dep}')"
              done
              echo '    }'
              echo '}'
            } > "$link_init"

            echo "::group::javadoc ${pkg}"
            ( cd "dist/java/${pkg}" && gradle -q --console=plain \
                --init-script "$link_init" javadoc )
            local out="${root}/${pkg}"
            mkdir -p "$out"
            cp -R "dist/java/${pkg}/build/docs/javadoc/." "$out/"
            echo "::endgroup::"
          }

          # Every package Hydra maps into Java gets its own JavaDoc tree.
          # Dependency order (kernel -> rdf/jvm -> the rest) so -linkoffline can
          # read each dependency's element-list from its just-built tree.
          # hydra-ext is excluded until it ships to Maven Central (#451).
          PACKAGES=(
            hydra-kernel
            hydra-rdf
            hydra-jvm
            hydra-build
            hydra-go
            hydra-haskell
            hydra-java
            hydra-lisp
            hydra-pg
            hydra-python
            hydra-scala
            hydra-typescript
          )
          for pkg in "${PACKAGES[@]}"; do
            build_pkg "$pkg"
          done

          # Sanity check: Term.html confirms the kernel sources rendered.
          test -f "${root}/hydra-kernel/hydra/core/Term.html" || {
            echo "::error::hydra/core/Term.html missing from generated javadoc"
            exit 1
          }

          echo "Per-package javadoc trees built:"
          for pkg in "${PACKAGES[@]}"; do
            echo "  ${pkg}: $(find "${root}/${pkg}" -name '*.html' | wc -l) html files"
          done

      - uses: actions/setup-python@v5
        if: steps.ci-run.outputs.proceed == 'true'
        with:
          python-version: '3.12'

      # Each dist/python/<pkg> is a standalone pyproject.toml wheel build (unlike
      # Java, autodoc works by IMPORTING the package, not reading source off disk —
      # so every documented package, plus its documented siblings it depends on,
      # must be installed into one venv before Sphinx runs). Install in dependency
      # order: hydra-kernel first (no internal deps), then hydra-rdf/hydra-pg
      # (both depend on hydra-kernel). sphinx-apidoc + autodoc + napoleon generate
      # the .rst stubs and pull docstrings; the Python coder already emits
      # Sphinx/RST cross-reference roles (:class:/:func:) inside those docstrings
      # (see hydra.python.serde.pythonDocEntityRef), which is why Sphinx was
      # chosen over pdoc (#620) — pdoc has no notion of RST roles and would
      # render them as dead literal text instead of links.
      #
      # Two hydra-python-specific wrinkles verified with a real local build
      # (#620 PR description has the details):
      #   1. `hydra` is a PEP 420 implicit namespace package (no __init__.py) —
      #      sphinx-apidoc silently produces flatly-named, unimportable modules
      #      (e.g. `rewriting` instead of `hydra.rewriting`) without
      #      --implicit-namespaces. That flag is required, not optional.
      #   2. hydra-kernel/hydra-rdf/hydra-pg all install INTO THE SAME shared
      #      hydra.* namespace on disk — there is no per-package directory
      #      boundary once installed. Pointing sphinx-apidoc at the shared
      #      site-packages/hydra tree after installing all three would document
      #      all three merged into one tree, defeating the per-package layout.
      #      Fixed by staging each package's OWN file list (from `pip show -f`,
      #      which pip tracks per-package correctly) into a scoped mirror
      #      directory before running apidoc on it — apidoc reads source, but
      #      autodoc still imports from the fully-installed venv, so cross-
      #      package imports inside a package's own modules still resolve.
      #
      # Cross-package links (hydra-rdf/hydra-pg -> hydra-kernel) are deferred to
      # a follow-up, same as JavaDoc's -linkoffline wiring in #616: Sphinx's
      # intersphinx needs each package's published objects.inv URL, which only
      # exists once that package's tree is deployed. Undocumented cross-refs
      # render as styled-but-unlinked code, not broken markup — see #620 PR
      # description for the local-build verification of this behavior.
      - name: Build per-package Sphinx docs
        if: steps.ci-run.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          root=_site/python/sphinx
          mkdir -p "$root"

          venv=$(mktemp -d)
          python3 -m venv "$venv"
          source "$venv/bin/activate"
          pip install -q --upgrade pip
          pip install -q sphinx

          for pkg in hydra-kernel hydra-rdf hydra-pg; do
            echo "::group::pip install ${pkg}"
            pip install -q "dist/python/${pkg}"
            echo "::endgroup::"
          done

          site_packages="$venv"/lib/python*/site-packages

          build_pkg() {
            local pkg="$1"
            echo "::group::sphinx ${pkg}"

            # Stage only this package's own files (per pip's per-package file
            # manifest), preserving their hydra/... path structure, so apidoc
            # documents just this package even though all three share the
            # hydra.* namespace on disk.
            local scoped
            scoped=$(mktemp -d)
            pip show -f "$pkg" | sed -n '/^Files:/,$p' | tail -n +2 | sed 's/^  //' | grep '\.py$' \
              | while read -r f; do
                  mkdir -p "$scoped/$(dirname "$f")"
                  cp $site_packages/"$f" "$scoped/$f"
                done

            local confdir
            confdir=$(mktemp -d)
            sphinx-quickstart --quiet -p "$pkg" -a "Hydra" -v "$(python3 -c 'import json; print(json.load(open("hydra.json"))["currentVersion"])')" \
              --sep --extensions sphinx.ext.autodoc,sphinx.ext.napoleon "$confdir"
            sphinx-apidoc --implicit-namespaces -o "$confdir/source" "$scoped/hydra"
            printf '\n.. toctree::\n   :maxdepth: 2\n\n   modules\n' >> "$confdir/source/index.rst"
            sphinx-build -q -b html "$confdir/source" "${root}/${pkg}"
            echo "::endgroup::"
          }

          build_pkg hydra-kernel
          build_pkg hydra-rdf
          build_pkg hydra-pg

          echo "Per-package Sphinx trees built:"
          for pkg in hydra-kernel hydra-rdf hydra-pg; do
            echo "  ${pkg}: $(find "${root}/${pkg}" -name '*.html' | wc -l) html files"
          done

      # Cross-workflow artifact download: pull dist-scala from the same CI run
      # that dist-java came from above.
      - name: Download dist-scala from CI run
        if: steps.ci-run.outputs.proceed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist-scala
          path: dist/scala/
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      # sbt version is read from each dist/scala/<pkg>/project/build.properties
      # (generated by bin/lib/generate-scala-package-build.py), which is why
      # this step runs AFTER the dist-scala download above rather than
      # unconditionally at job start.
      - name: Set up sbt
        if: steps.ci-run.outputs.proceed == 'true'
        uses: sbt/setup-sbt@v1

      - uses: actions/setup-java@v4
        if: steps.ci-run.outputs.proceed == 'true'
        with:
          distribution: temurin
          # sbt itself needs a newer JDK than the javadoc/gradle steps above;
          # matches the `scala` job in ci.yml.
          java-version: '17'

      # Scala 3 scaladoc cannot cross-link SEPARATE per-package trees: a
      # reference to a type from a binary-jar dependency (e.g. hydra.core.Type
      # seen from hydra-pg) renders as an unresolved link, and scaladoc's
      # -external-mappings only rewrites references it already RESOLVED to an
      # external symbol — so it has no effect on jar-dependency references,
      # even with TASTy present. Cross-links resolve ONLY when all sources are
      # documented in a SINGLE scaladoc run. So — unlike the Java job's 12
      # standalone -linkoffline trees — Scala is documented as ONE unified
      # scaladoc site covering all 12 packages compiled together, at
      # scala/scaladoc/. Every intra-Hydra reference then resolves as a real
      # internal hyperlink (verified: ~5900 resolved hydra.core.Type links vs
      # 0 in a standalone per-package build).
      #
      # The unified doc project aggregates each package's generated sources
      # (dist/scala/<pkg>/src/main/scala, which already include the copied
      # kernel overlay) plus their third-party libraryDependencies. No
      # inter-package publishLocal is needed: the sources are compiled together
      # in one project, so there are no Maven coordinates to resolve between them.
      - name: Build unified scaladoc over all packages
        if: steps.ci-run.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # The unified scaladoc tree lands under scala/scaladoc/api/ so the
          # custom landing page (docs/scala-scaladoc-index.html, staged to
          # scala/scaladoc/index.html) does not collide with scaladoc's own
          # generated root index.html.
          root=_site/scala/scaladoc/api
          mkdir -p "$root"

          # All dist/scala/<pkg>/ packages (dependency order is irrelevant for a
          # single compile; listed alphabetically). hydra-ext is excluded (#451).
          PACKAGES=(
            hydra-build hydra-go hydra-haskell hydra-java hydra-jvm
            hydra-kernel hydra-lisp hydra-pg hydra-python hydra-rdf
            hydra-scala hydra-typescript
          )

          # Collect third-party dependency coordinates from every package's
          # build.sbt (the "net.fortytwo.hydra.scala" inter-package deps are
          # dropped — those are provided as source here, not as artifacts).
          repo="$(pwd)"
          proj="${repo}/_scaladoc-unified"
          rm -rf "$proj"; mkdir -p "$proj/project"
          echo 'sbt.version=1.10.7' > "$proj/project/build.properties"

          # Emit the aggregation build.sbt: all package source dirs as unmanaged
          # sources, external (non-Hydra) libraryDependencies unioned, and a doc
          # title. scalaVersion matches the generated packages (3.3.7).
          {
            echo 'ThisBuild / scalaVersion := "3.3.7"'
            echo 'lazy val root = (project in file(".")).settings('
            echo '  name := "hydra",'
            echo '  Compile / unmanagedSourceDirectories := Seq('
            first=1
            for pkg in "${PACKAGES[@]}"; do
              [ "$first" -eq 1 ] && first=0 || echo ','
              printf '    file("%s/dist/scala/%s/src/main/scala")' "$repo" "$pkg"
            done
            echo ''
            echo '  ),'
            # Union of external libraryDependencies across all packages. Grep the
            # generated build.sbt files for `"group" % "artifact" % "version"`
            # lines that are NOT net.fortytwo.hydra.scala (those are our sources).
            # The `|| true` is required: the generated packages currently declare
            # NO external deps, so the grep matches nothing and (under
            # `set -o pipefail`) would otherwise abort the whole script with a
            # non-zero pipe status, leaving an empty Seq().
            echo '  libraryDependencies ++= Seq('
            { grep -rhoE '"[a-zA-Z0-9._-]+" +%%? +"[a-zA-Z0-9._-]+" +% +"[a-zA-Z0-9._-]+"' \
                dist/scala/*/build.sbt 2>/dev/null \
                | grep -v 'net.fortytwo.hydra.scala' \
                | sort -u \
                | sed 's/^/    /; s/$/,/' \
                | sed '$ s/,$//' ; } || true
            echo '  ),'
            echo '  Test / unmanagedSourceDirectories := Seq.empty,'
            echo '  test := {},'
            echo '  Compile / doc / scalacOptions ++= Seq("-project", "Hydra")'
            echo ')'
          } > "$proj/build.sbt"

          echo "::group::generated unified build.sbt"
          cat "$proj/build.sbt"
          echo "::endgroup::"

          echo "::group::sbt doc (unified, all ${#PACKAGES[@]} packages)"
          ( cd "$proj" && sbt -batch doc )
          echo "::endgroup::"

          api="$proj/target/scala-3.3.7/api"
          test -f "$api/index.html" || {
            echo "::error::index.html missing from unified scaladoc"
            exit 1
          }
          # Sanity check: cross-package links must resolve (regression guard for
          # the whole reason this is a unified build). hydra.core.Type is
          # referenced from many packages; require it to be linked.
          links=$(grep -rhoE 'href="[^"]*core/Type\.html"' "$api" 2>/dev/null | wc -l | tr -d ' ')
          echo "resolved hydra.core.Type cross-links: ${links}"
          [ "${links}" -gt 0 ] || {
            echo "::error::no resolved hydra.core.Type cross-links — unified build regressed"
            exit 1
          }

          cp -R "$api/." "$root/"
          echo "Unified scaladoc: $(find "$root" -name '*.html' | wc -l) html files across ${#PACKAGES[@]} packages"

          # Backward-compatible redirects: earlier releases published per-package
          # trees at scala/scaladoc/<pkg>/ (linked from the hydra-scala README and
          # possibly external sites). The unified build has no per-package roots,
          # so leave a meta-refresh stub at each old path pointing to that
          # package's entry page inside the unified api/ tree, so those URLs keep
          # resolving instead of 404ing. Map: <pkg> -> api-relative entry page.
          site="${root%/api}"   # _site/scala/scaladoc
          declare -A ENTRY=(
            [hydra-kernel]="hydra/core.html"
            [hydra-jvm]="hydra/jvm/serde.html"
            [hydra-rdf]="hydra/rdf.html"
            [hydra-pg]="hydra/pg.html"
            [hydra-java]="hydra/java.html"
            [hydra-scala]="hydra/scala.html"
            [hydra-python]="hydra/python.html"
            [hydra-haskell]="hydra/haskell.html"
            [hydra-typescript]="hydra/typeScript.html"
            [hydra-lisp]="hydra/lisp.html"
            [hydra-go]="hydra/go.html"
            [hydra-build]="hydra/build.html"
          )
          for pkg in "${!ENTRY[@]}"; do
            target="../api/${ENTRY[$pkg]}"
            mkdir -p "${site}/${pkg}"
            {
              printf '%s\n' '<!doctype html>'
              printf '%s\n' '<meta charset="utf-8">'
              printf '%s\n' "<title>${pkg} — Hydra Scala API</title>"
              printf '%s\n' "<meta http-equiv=\"refresh\" content=\"0; url=${target}\">"
              printf '%s\n' "<link rel=\"canonical\" href=\"${target}\">"
              printf '%s\n' "<p>The Hydra Scala API is now a single unified reference. Redirecting to <a href=\"${target}\">${pkg} in the unified API</a>&hellip;</p>"
            } > "${site}/${pkg}/index.html"
          done
          echo "Wrote ${#ENTRY[@]} per-package redirect stubs under ${site}/"

      - name: Stage landing pages
        if: steps.ci-run.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # Root landing page for the whole site.
          cp docs/index.html _site/index.html
          # Java API index linking into each per-package JavaDoc tree
          # (java/javadoc/<pkg>/). The per-package trees are produced by the
          # build step above.
          cp docs/java-javadoc-index.html _site/java/javadoc/index.html
          # Python API index linking into each per-package Sphinx tree
          # (python/sphinx/<pkg>/). The per-package trees are produced by the
          # build step above.
          cp docs/python-sphinx-index.html _site/python/sphinx/index.html
          # Scala API index linking into each per-package Scaladoc tree
          # (scala/scaladoc/<pkg>/). The per-package trees are produced by the
          # build step above.
          cp docs/scala-scaladoc-index.html _site/scala/scaladoc/index.html

      - if: steps.ci-run.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3

    outputs:
      proceed: ${{ steps.ci-run.outputs.proceed }}

  deploy:
    name: Deploy to Pages
    needs: build
    if: needs.build.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
