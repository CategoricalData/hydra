name: Release verification

# Verifies the release-trust invariants for a Hydra source release (Track 7 of
# #441): the canonical source archive carries LICENSE + NOTICE, builds via
# `git archive`, and round-trips its SHA-512 checksum; and, once a signing key
# is registered in KEYS, that its detached GPG signature verifies.
#
# This is intentionally a SEPARATE workflow from ci.yml: ci.yml runs the
# per-language test matrix on every push/PR to main, whereas this runs only on
# a release tag (and on manual dispatch). It needs no language toolchain — it
# checks artifact hygiene, not code — so it is fast and self-contained.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to verify (branch, tag, or SHA). Defaults to the checked-out ref.'
        required: false
        default: ''

jobs:
  verify-source-release:
    name: Verify canonical source archive
    runs-on: ubuntu-latest
    steps:
      - name: Check out the ref under verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Assert LICENSE, NOTICE, and KEYS are present and tracked
        run: |
          fail=0
          for f in LICENSE NOTICE KEYS; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "OK: $f is tracked"
            else
              echo "FAIL: $f is missing or untracked (required for an Apache source release)"
              fail=1
            fi
          done
          exit $fail

      - name: Determine version
        id: version
        run: |
          # On a tag push the tag name is the version; otherwise use hydra.json.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(python3 -c "import json; print(json.load(open('hydra.json'))['currentVersion'])")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Verifying release version: $version"

          # If this is a tag, it must match hydra.json:currentVersion.
          canonical="$(python3 -c "import json; print(json.load(open('hydra.json'))['currentVersion'])")"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$version" != "$canonical" ]; then
            echo "FAIL: tag $version != hydra.json currentVersion $canonical"
            exit 1
          fi

      - name: Build the canonical source archive (git archive)
        id: archive
        run: |
          version="${{ steps.version.outputs.version }}"
          archive="hydra-${version}-src.tar.gz"
          # Build BOTH forms from the same tree object:
          #  - the .tar.gz is the distributed convenience artifact (checksummed),
          #  - the uncompressed .tar is what the GPG signature covers, because
          #    `git archive`'s gzip layer embeds a timestamp/OS byte and is NOT
          #    byte-reproducible across git/gzip versions, so a signature over the
          #    .tar.gz can never verify on a different runner. The uncompressed
          #    tar IS content-deterministic, so its signature verifies anywhere.
          git archive --format=tar    --prefix="hydra-${version}/" -o "hydra-${version}-src.tar" HEAD
          # `gzip -k` writes <name>.gz alongside the input, which IS "$archive"
          # (hydra-<version>-src.tar.gz) — so no rename is needed. The `mv` that
          # used to follow became a self-move when #441/0483d7133d switched this
          # step to build the uncompressed .tar first, and `mv X X` is an error
          # under `bash -e`, which is what failed this job on every tag since.
          gzip -n -k -f "hydra-${version}-src.tar"
          echo "archive=$archive"        >> "$GITHUB_OUTPUT"
          echo "tar=hydra-${version}-src.tar" >> "$GITHUB_OUTPUT"
          echo "Built $archive ($(du -h "$archive" | cut -f1)) + uncompressed .tar for signing"

      - name: Assert LICENSE + NOTICE are inside the archive
        run: |
          version="${{ steps.version.outputs.version }}"
          archive="${{ steps.archive.outputs.archive }}"
          fail=0
          for f in LICENSE NOTICE; do
            if tar tzf "$archive" | grep -qx "hydra-${version}/$f"; then
              echo "OK: archive contains $f"
            else
              echo "FAIL: archive is missing $f"
              fail=1
            fi
          done
          exit $fail

      - name: Generate and verify the SHA-512 checksum
        run: |
          archive="${{ steps.archive.outputs.archive }}"
          sha512sum "$archive" > "$archive.sha512"
          sha512sum -c "$archive.sha512"
          echo "OK: checksum verifies"

      - name: Verify the GPG signature (from the release assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar="${{ steps.archive.outputs.tar }}"
          version="${{ steps.version.outputs.version }}"
          # KEYS holds the public signing keys. Until a release manager registers
          # one (see KEYS), there is nothing to verify against — report and skip.
          if ! grep -q "BEGIN PGP PUBLIC KEY BLOCK" KEYS; then
            echo "NOTE: no signing key registered in KEYS yet — skipping signature verification."
            exit 0
          fi
          # The detached signature is NOT a committed file: it signs a git-archive
          # of the tagged tree, so committing it would be self-referential (the
          # commit changes HEAD, changing the archive). It is published as an ASSET
          # on the GitHub Release for the tag (bin/prepare-release.sh Step 12 builds
          # hydra-<version>-src.tar[.gz]+.sha512+.asc into release-artifacts/; the
          # release manager attaches the .asc to the release). We verify against the
          # reproducible uncompressed .tar.
          sig="hydra-${version}-src.tar.asc"
          if [ "${{ github.ref_type }}" = "tag" ] && \
             gh release download "$version" --pattern "$sig" --output "$sig" 2>/dev/null; then
            gpg --import KEYS
            gpg --verify "$sig" "$tar"
            echo "OK: signature verifies against the uncompressed source tar"
          else
            echo "NOTE: no detached signature ($sig) attached to the '$version' GitHub Release yet."
            echo "      A signed release should attach it (see docs/release-workflow.md, prepare-release Step 12)."
            echo "      Not failing: the signature is a release ASSET, added when the release is finalized,"
            echo "      not a committed file. Re-run this workflow after attaching the .asc to hard-verify."
          fi

      - name: Upload the verified source archive
        uses: actions/upload-artifact@v4
        with:
          name: hydra-source-release
          path: |
            hydra-*-src.tar.gz
            hydra-*-src.tar.gz.sha512
          if-no-files-found: error
